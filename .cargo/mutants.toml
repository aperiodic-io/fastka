# cargo-mutants (`cargo mutants`): every mutant of the library must make a test fail, or be listed
# below with why no test can tell it from the original.
test_tool = "nextest"
# the producer's and consumer's tests wait on real sockets and timers: a mutant that hangs one is
# caught by its timeout, kept short of the suite's own
timeout_multiplier = 3.0
minimum_test_timeout = 60
# a mutant that leaves a variable unused must still build under -D warnings, or it is filed as
# unviable instead of tested
cap_lints = true
profile = "mutants"
# The Kani proofs: only Kani compiles them (`#[cfg(kani)]`), so a mutant of one builds the same
# binary and no test can catch it. CI's kani job checks them.
exclude_globs = ["src/proofs.rs"]
exclude_re = [
  # Equivalent: a send waking the broker's thread when its partition has a batch in flight too
  # (`&&` to `||`) only wakes it for nothing: it cannot send another batch of that partition until
  # the one in flight is answered. More wakes, the same requests.
  "producer\\.rs:\\d+:46: replace && with \\|\\| in Producer<C>::send$",
  # Equivalent: `poll`'s least wait of 1 ms past a deadline already gone (a batch in a request
  # past it), and its second-long nap when nothing is due and it waits forever, only keep it from
  # spinning; without them it spins, handing over the same reports.
  "producer\\.rs:\\d+:(61|49): replace \\+ with - in Producer<C>::poll$",
  # Equivalent: a producer's first keyless partition drawn out of range (`%` to `+`) is moved into
  # range, still at random, by the check after it; one in range moved on at a metadata refresh
  # (`>=` to `<`) is another partition of the same topic. Where keyless records go, never whether.
  "producer\\.rs:\\d+:47: replace % with \\+ in apply_metadata$",
  "producer\\.rs:\\d+:41: replace >= with < in apply_metadata$",
  # Equivalent: which batches' deadlines wake `poll` sets how soon `poll` times them out itself;
  # the producer's own thread and the broker threads time them out too, within 100 ms.
  "producer\\.rs:.*delete ! in next_deadline$",
  # Equivalent: a throttle of 0 ms (`>` to `>=`) waits until now.
  "producer\\.rs:\\d+:40: replace > with >= in broker$",
  # Equivalent (from brrrrr-kafka's list): a deadline met at its very nanosecond or just after it
  # (the lookups' and a broker's backoff, a throttle's end, a Fetch's timeout, an overdue Fetch),
  # A partition's bytes at exactly its bound (`<` to `<=` at :96) fetching once more is the bound's
  # last byte, not past it.
  "consumer\\.rs:\\d+:(16|39|96): replace < with <= in Consumer::(lookups|send|pump)$",
  "consumer\\.rs:\\d+:(47|28|81): replace > with >= in Consumer::(receive|answered|overdue)$",
  # Equivalent: a lookup's answer for a partition that has a position (`||` to `&&`) is never in
  # the partition's own epoch: a position is set only by a lookup's answer or a seek, and a seek
  # starts a new epoch.
  "consumer\\.rs:\\d+:44: replace \\|\\| with && in Consumer::found$",
  # Equivalent: a Fetch pipelined to a broker whose answer had a corrupt batch (`&&` to `||`)
  # goes on a connection dropped right after, unread.
  "consumer\\.rs:\\d+:30: replace && with \\|\\| in Consumer::answered$",
  # Not reached by a test: a Fetch is far smaller than a socket's send buffer, so it is always
  # written whole and the 1 ms slice for one half written (`<` to `>`) is never taken.
  "consumer\\.rs:\\d+:93: replace < with > in Consumer::wait_slice$",
]
